<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bó Hoa Mẫu Đơn</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #ffc0cb; /* Nền màu hồng */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .bouquet-container {
            position: relative;
            width: 350px;
            height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Lớp giấy gói bên ngoài và nơ */
        .wrapper-paper {
            position: absolute;
            bottom: 0;
            width: 320px;
            height: 350px;
            background: linear-gradient(135deg, #f5d6ba, #e2b08a);
            border-radius: 20px 20px 100px 100px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 2;
        }

        .wrapper-paper::before {
            content: '';
            position: absolute;
            top: -40px;
            left: -20px;
            right: -20px;
            height: 150px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 50%;
            z-index: -1;
        }

        /* Phần thân và ruy băng */
        .ribbon {
            position: absolute;
            bottom: 80px;
            width: 40px;
            height: 40px;
            background: #ffb6c1;
            border-radius: 50%;
            z-index: 4;
        }

        .ribbon-tail-1, .ribbon-tail-2 {
            position: absolute;
            bottom: -60px;
            width: 15px;
            height: 100px;
            background: linear-gradient(to bottom, #ffb6c1, #e2b08a);
            z-index: 3;
            transform-origin: top;
        }

        .ribbon-tail-1 {
            left: 10px;
            transform: rotate(15deg);
        }

        .ribbon-tail-2 {
            right: 10px;
            transform: rotate(-15deg);
        }

        /* Khu vực chứa các bông hoa */
        .flowers-cluster {
            position: absolute;
            top: 20px;
            width: 300px;
            height: 250px;
            z-index: 3;
        }

        /* Kiểu dáng chung cho hoa mẫu đơn */
        .peony {
            position: absolute;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #ff99bb 0%, #ff6699 60%, #ff4d88 100%);
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .peony::before {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            background: radial-gradient(circle, #ffb3d1 0%, #ff80ab 70%);
            border-radius: 50%;
            opacity: 0.9;
        }

        .peony::after {
            content: '';
            position: absolute;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            background: radial-gradient(circle, #ffe6f0 0%, #ff99bb 80%);
            border-radius: 50%;
        }

        /* Định vị từng bông hoa để tạo thành bó tròn */
        .p1 { top: 30px; left: 110px; transform: scale(1.2); }
        .p2 { top: 70px; left: 60px; transform: scale(1.1); }
        .p3 { top: 60px; left: 160px; transform: scale(1.15); }
        .p4 { top: 120px; left: 30px; }
        .p5 { top: 130px; left: 100px; transform: scale(1.25); }
        .p6 { top: 120px; left: 180px; transform: scale(1.1); }
        .p7 { top: 0px; left: 75px; transform: scale(0.9); }
        .p8 { top: 10px; left: 160px; transform: scale(0.95); }

        /* Lá cây xanh điểm xuyết */
        .leaf {
            position: absolute;
            width: 20px;
            height: 10px;
            background-color: #76c7c0;
            border-radius: 50% 0 50% 0;
            z-index: 2;
        }

        .l1 { top: 25px; left: 95px; transform: rotate(-30deg); }
        .l2 { top: 50px; left: 40px; transform: rotate(45deg); }
        .l3 { top: 100px; left: 10px; transform: rotate(15deg); }
        .l4 { top: 40px; left: 210px; transform: rotate(-60deg); }
        .l5 { top: 110px; left: 240px; transform: rotate(30deg); }
    </style>
</head>
<body>

    <div class="bouquet-container">
        <!-- Giấy gói hoa -->
        <div class="wrapper-paper"></div>

        <!-- Ruy băng và dây thắt -->
        <div class="ribbon"></div>
        <div class="ribbon-tail-1"></div>
        <div class="ribbon-tail-2"></div>

        <!-- Các bông hoa và lá -->
        <div class="flowers-cluster">
            <!-- Lá -->
            <div class="leaf l1"></div>
            <div class="leaf l2"></div>
            <div class="leaf l3"></div>
            <div class="leaf l4"></div>
            <div class="leaf l5"></div>

            <!-- Hoa mẫu đơn -->
            <div class="peony p1"></div>
            <div class="peony p2"></div>
            <div class="peony p3"></div>
            <div class="peony p4"></div>
            <div class="peony p5"></div>
            <div class="peony p6"></div>
            <div class="peony p7"></div>
            <div class="peony p8"></div>
        </div>
    </div>

</body>
</html>
