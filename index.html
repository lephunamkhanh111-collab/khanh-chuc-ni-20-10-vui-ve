<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10 - Kim Ngân</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffb6c1; /* Nền màu hồng */
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Trang trí nền sao và trái tim màu trắng */
        .background-decor {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .decor-item {
            position: absolute;
            color: #ffffff;
            opacity: 0.8;
            animation: floatSlow 6s infinite ease-in-out alternate;
        }

        @keyframes floatSlow {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-15px) scale(1.1); }
        }

        /* Chữ lời chúc ở trên bó hoa */
        .top-greeting-text {
            margin-bottom: 15px;
            font-size: 20px;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 5;
            animation: pulseText 2s infinite alternate;
        }

        @keyframes pulseText {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Khu vực bó hoa */
        .bouquet-container {
            position: relative;
            width: 340px;
            height: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Giấy gói hoa */
        .wrapper-paper {
            position: absolute;
            bottom: 0;
            width: 280px;
            height: 260px;
            background: linear-gradient(135deg, #f5d6c6 0%, #e8b49e 100%);
            border-radius: 20px 20px 100px 100px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            z-index: 2;
            display: flex;
            justify-content: center;
        }

        .wrapper-inner {
            position: absolute;
            top: -20px;
            width: 240px;
            height: 210px;
            background: #fff8f0;
            border-radius: 50% 50% 40% 40%;
            opacity: 0.9;
        }

        /* Nơ buộc bó hoa */
        .ribbon {
            position: absolute;
            bottom: 75px;
            width: 90px;
            height: 45px;
            background-color: #f7a8b8;
            border-radius: 20px;
            z-index: 4;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .ribbon::before, .ribbon::after {
            content: '';
            position: absolute;
            bottom: -35px;
            width: 25px;
            height: 50px;
            background-color: #f7a8b8;
            border-radius: 0 0 10px 10px;
        }
        .ribbon::before { left: 10px; transform: rotate(15deg); }
        .ribbon::after { right: 10px; transform: rotate(-15deg); }

        /* Khu vực chứa hoa */
        .flowers-group {
            position: absolute;
            top: 5px;
            width: 300px;
            height: 240px;
            z-index: 3;
        }

        /* Các bông hoa chính có thể bấm để tải/xem ảnh (Mặc định chưa có ảnh sẽ là màu đỏ) */
        .flower {
            position: absolute;
            width: 65px;
            height: 65px;
            background: radial-gradient(circle, #ff4d4d 0%, #cc0000 70%); /* Màu đỏ khi chưa có ảnh */
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
            border: 2px dashed #fff;
        }

        /* Khi hoa đã có ảnh sẽ chuyển sang màu hồng */
        .flower.has-image {
            background: radial-gradient(circle, #ff99bb 0%, #ff6699 70%);
        }

        .flower:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(255, 255, 255, 0.7);
        }

        .flower span {
            font-size: 9px;
            color: white;
            text-align: center;
            padding: 2px 4px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            pointer-events: none;
        }

        .flower input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Tọa độ 8 bông hoa chính */
        .f1 { top: -5px; left: 110px; }
        .f2 { top: 30px; left: 50px; }
        .f3 { top: 35px; left: 180px; }
        .f4 { top: 85px; left: 15px; }
        .f5 { top: 90px; left: 90px; }
        .f6 { top: 85px; left: 165px; }
        .f7 { top: 140px; left: 55px; }
        .f8 { top: 140px; left: 140px; }

        /* Rất nhiều bông hoa phụ trang trí xung quanh (chỉ để trưng bày) */
        .bg-flower {
            position: absolute;
            width: 45px;
            height: 45px;
            background: radial-gradient(circle, #ffccd5 0%, #ff99aa 80%);
            border-radius: 50%;
            opacity: 0.85;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            pointer-events: none; /* Không bấm được */
        }
        .bf1 { top: 10px; left: 20px; }
        .bf2 { top: 5px; left: 230px; }
        .bf3 { top: 60px; left: 235px; }
        .bf4 { top: 120px; left: 210px; }
        .bf5 { top: 160px; left: 105px; }
        .bf6 { top: 115px; left: 120px; }
        .bf7 { top: 55px; left: 120px; }
        .bf8 { top: 130px; left: 5px; }
        .bf9 { top: 20px; left: 80px; }
        .bf10 { top: 80px; left: 50px; }
        .bf11 { top: 40px; left: 140px; }
        .bf12 { top: 100px; left: 200px; }

        /* Dòng chữ nhỏ bên dưới bó hoa */
        .footer-text {
            margin-top: 15px;
            font-size: 14px;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            z-index: 5;
            letter-spacing: 0.5px;
        }

        /* Hộp thoại hiển thị ảnh (Popup) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            position: relative;
            background: white;
            padding: 15px;
            border-radius: 12px;
            max-width: 90%;
            max-height: 90%;
            box-shadow: 0 5px 25px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 8px;
            display: block;
        }

        /* Nút tắt "X" */
        .close-btn {
            position: absolute;
            top: -14px;
            right: -14px;
            width: 36px;
            height: 36px;
            background-color: #ff4d4d;
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            transition: background-color 0.2s, transform 0.2s;
        }

        .close-btn:hover {
            background-color: #ff1a1a;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <!-- Nền trang trí sao và trái tim -->
    <div class="background-decor">
        <div class="decor-item" style="top: 10%; left: 15%; font-size: 24px;">★</div>
        <div class="decor-item" style="top: 25%; left: 80%; font-size: 20px;">❤</div>
        <div class="decor-item" style="top: 70%; left: 10%; font-size: 22px;">❤</div>
        <div class="decor-item" style="top: 80%; left: 85%; font-size: 26px;">★</div>
        <div class="decor-item" style="top: 45%; left: 5%; font-size: 18px;">★</div>
        <div class="decor-item" style="top: 15%; left: 50%; font-size: 20px;">❤</div>
        <div class="decor-item" style="top: 85%; left: 40%; font-size: 24px;">★</div>
        <div class="decor-item" style="top: 55%; left: 90%; font-size: 22px;">❤</div>
    </div>

    <!-- Dòng chữ chúc mừng ở trên -->
    <div class="top-greeting-text">Chúc Kim Ngân 20/10 Luôn Xinh Đẹp</div>

    <!-- Bó hoa -->
    <div class="bouquet-container">
        <div class="wrapper-paper">
            <div class="wrapper-inner"></div>
        </div>
        <div class="ribbon"></div>

        <!-- Nhóm hoa gồm nhiều hoa phụ trang trí và 8 bông hoa chính -->
        <div class="flowers-group">
            <!-- Các bông hoa phụ trang trí (chỉ để trưng, không bấm được) -->
            <div class="bg-flower bf1"></div>
            <div class="bg-flower bf2"></div>
            <div class="bg-flower bf3"></div>
            <div class="bg-flower bf4"></div>
            <div class="bg-flower bf5"></div>
            <div class="bg-flower bf6"></div>
            <div class="bg-flower bf7"></div>
            <div class="bg-flower bf8"></div>
            <div class="bg-flower bf9"></div>
            <div class="bg-flower bf10"></div>
            <div class="bg-flower bf11"></div>
            <div class="bg-flower bf12"></div>

            <!-- 8 Bông hoa chính (Màu đỏ khi chưa có ảnh, bấm vào để chọn ảnh .jpg) -->
            <div class="flower f1" onclick="triggerFlower(this, 0)">
                <span>Chọn ảnh</span>
                <input type="file" accept=".jpg, .jpeg" onchange="previewImage(event, this, 0)">
            </div>
            <div class="flower f2" onclick="triggerFlower(this, 1)">
                <span>Chọn ảnh</span>
                <input type="file" accept=".jpg, .jpeg" onchange="previewImage(event, this, 1)">
            </div>
            <div class="flower f3" onclick="triggerFlower(this, 2)">
                <span>Chọn ảnh</span>
                <input type="file" accept=".jpg, .jpeg" onchange="previewImage(event, this, 2)">
            </div>
            <div class="flower f4" onclick="triggerFlower(this, 3)">
                <span>Chọn ảnh</span>
                <input type="file" accept=".jpg, .jpeg" onchange="previewImage(event, this, 3)">
            </div>
            <div class="flower f5" onclick="triggerFlower(this, 4)">
                <span>Chọn ảnh</span>
                <input type="file" accept=".jpg, .jpeg" onchange="previewImage(event, this, 4)">
            </div>
            <div class="flower f6" onclick="triggerFlower(this, 5)">
                <span>Chọn ảnh</span>
                <input type="file" accept=".jpg, .jpeg" onchange="previewImage(event, this, 5)">
            </div>
            <div class="flower f7" onclick="triggerFlower(this, 6)">
                <span>Chọn ảnh</span>
                <input type="file" accept=".jpg, .jpeg" onchange="previewImage(event, this, 6)">
            </div>
            <div class="flower f8" onclick="triggerFlower(this, 7)">
                <span>Chọn ảnh</span>
                <input type="file" accept=".jpg, .jpeg" onchange="previewImage(event, this, 7)">
            </div>
        </div>
    </div>

    <!-- Dòng chữ nhỏ bên dưới bó hoa -->
    <div class="footer-text">chạm vào hoa điii ngun</div>

    <!-- Modal hiển thị ảnh khi bấm vào hoa -->
    <div class="modal" id="imageModal">
        <div class="modal-content">
            <div class="close-btn" onclick="closeModal()">×</div>
            <img id="modalImage" src="" alt="Ảnh kỷ niệm">
        </div>
    </div>

    <script>
        // Mảng lưu trữ ảnh cho 8 bông hoa
        const flowerImages = {
            0: "", 1: "", 2: "", 3: "", 4: "", 5: "", 6: "", 7: ""
        };

        function triggerFlower(element, index) {
            // Nếu bông hoa đã có ảnh, hiển thị ảnh đó khi bấm vào
            if (flowerImages[index]) {
                showModal(flowerImages[index]);
            }
        }

        function previewImage(event, input, index) {
            event.stopPropagation(); // Ngăn sự kiện nổi bọt
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    flowerImages[index] = e.target.result; // Lưu dữ liệu ảnh
                    
                    // Đổi nhãn trên bông hoa thành "Xem ảnh" và chuyển màu từ đỏ sang hồng
                    input.previousElementSibling.innerText = "Xem ảnh";
                    input.parentElement.classList.add('has-image');
                    
                    showModal(e.target.result); // Hiển thị popup ảnh luôn
                }
                reader.readAsDataURL(file);
            }
        }

        function showModal(src) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modalImg.src = src;
            modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.style.display = 'none';
        }

        // Đóng modal khi click ra vùng ngoài ô ảnh
        window.onclick = function(event) {
            const modal = document.getElementById('imageModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
